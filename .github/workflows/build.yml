name: Investa - build e release

on:
  push:
    branches: ["main", "master", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Testes e dados reais (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fontes de dados reais (Yahoo Finance, Banco Central, Tesouro, notícias)
        run: node dist-electron/smoke.js
        continue-on-error: true
      - name: Teste de ponta a ponta do aplicativo (Electron)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node scripts/e2e.mjs
        env:
          SHOTS: e2e-shots
      - name: Guardar prints das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-das-telas
          path: e2e-shots/
          if-no-files-found: ignore

  windows:
    name: Instalador Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Definir versão
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Gerar instalador e versão portátil
        run: npx electron-builder --win --x64 --publish never
      - name: Guardar .exe
        uses: actions/upload-artifact@v4
        with:
          name: Investa-Windows-${{ env.VERSION }}
          path: release/*.exe
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Investa ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: release/*.exe
          body: |
            ## Como instalar

            - **Investa-Setup-${{ env.VERSION }}.exe** — instalador (recomendado). Cria atalho na área de trabalho e no menu Iniciar.
            - **Investa-Portatil-${{ env.VERSION }}.exe** — versão portátil, roda sem instalar.

            Na primeira vez, o Windows pode mostrar "O Windows protegeu o computador" (o app ainda não tem certificado de assinatura). Clique em **Mais informações → Executar assim mesmo**.

            ## Primeiro acesso

            1. Crie a primeira conta: ela será a conta **Dono**.
            2. Responda o questionário (renda, gastos, quanto pode investir, perfil).
            3. Para ativar o Professor IA: **Configurações → Inteligência Artificial** e cole sua chave da NVIDIA (`nvapi-...`).
